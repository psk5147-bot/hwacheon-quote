<script type="module">
  // 페이지 로드 시 로그인 상태 자동 감지
  import { getAuth, onAuthStateChanged, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGxFBHkjxfeDgdMK2ktPiUuXn9YPWO7xU",
    authDomain: "hwacheon-quote.firebaseapp.com",
    projectId: "hwacheon-quote",
    storageBucket: "hwacheon-quote.firebasestorage.app",
    messagingSenderId: "893820206009",
    appId: "1:893820206009:web:c0b55e88a0a14877669468"
  };

  const app2 = initializeApp(firebaseConfig, "app2");
  const auth2 = getAuth(app2);
  const db2 = getFirestore(app2);

  // 로그인 상태 영구 유지
  setPersistence(auth2, browserLocalPersistence);

  window._authHandled = false;
  onAuthStateChanged(auth2, async (user) => {
    if(user && !window._authHandled){
      window._authHandled = true;
      // 이미 로그인된 상태 → 바로 메인 앱 표시 (로그인 화면 없이)
      document.getElementById('login-screen').style.opacity='0';document.getElementById('login-screen').style.pointerEvents='none';
      document.getElementById('main-app').style.display='block';
      document.getElementById('user-info').textContent = user.email;
      // Firestore 실시간 리스너 시작 (quotes)
      try{
        const q = query(collection(db2,'quotes'), orderBy('savedAt','desc'));
        onSnapshot(q, (snap) => {
          _docsCache = {};
          snap.forEach(d => { _docsCache['htc_doc_'+d.id] = d.data(); });
          // 문서함 탭이 열려있으면 자동 갱신
          if(document.getElementById('panel-docs') && document.getElementById('panel-docs').classList.contains('active')){
            if(typeof renderDocs==='function') renderDocs();
          }
          if(typeof setBadge==='function') setBadge('동기화됨 ✓');
        });
      }catch(e){ console.log('문서 리스너 실패', e); }
      // Firestore 실시간 리스너 시작 (customers)
      try{
        onSnapshot(collection(db2,'customers'), (snap) => {
          _custsCache = [];
          snap.forEach(d => { _custsCache.push(d.data()); });
          if(document.getElementById('panel-customers') && document.getElementById('panel-customers').classList.contains('active')){
            if(typeof renderCustomers==='function') renderCustomers();
          }
        });
      }catch(e){ console.log('거래처 리스너 실패', e); }
      window._firebaseUser = true;
      if(window._domReady) window._checkDraft();
    }else if(!user){
      // 비로그인 → 로그인 화면 표시
      document.getElementById('login-screen').style.opacity='1';document.getElementById('login-screen').style.pointerEvents='auto';
    }
  });
</script>

   공통 그리드 (q-grid: 2열, 모바일 자동)
════════════════════════════════════ */
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-span2{grid-column:span 2}

/* 품목 검색바 (항상 상단 고정) */
.item-search-bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.item-search-bar input{flex:1;border:1px solid var(--border);border-radius:6px;
  padding:8px 12px;font-family:var(--font);font-size:13px;outline:none}
.item-search-bar input:focus{border-color:var(--primary-light)}

/* ════════════════════════════════════
   품목 카드 (모바일용)
════════════════════════════════════ */
#item-card-list{display:none}
.item-card{background:#fff;border:1px solid #e2ddd6;border-radius:10px;
  padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.item-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.item-card-num{background:var(--primary);color:#fff;border-radius:50%;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0}
.item-card-title{font-size:14px;font-weight:600;color:var(--primary);
  margin-left:8px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-card-del{border:none;background:transparent;cursor:pointer;
  color:#ccc;font-size:24px;line-height:1;padding:0 4px;flex-shrink:0}
.item-card-del:active{color:var(--danger)}
.item-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-card-field{display:flex;flex-direction:column;gap:4px}
.item-card-field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.item-card-field input,.item-card-field select{
  border:1px solid var(--border);border-radius:6px;padding:9px 10px;
  font-family:var(--font);font-size:16px;background:#fff;outline:none;width:100%}
.item-card-field input:focus,.item-card-field select:focus{
  border-color:var(--primary-light);box-shadow:0 0 0 2px rgba(45,95,138,.1)}
.item-card-field.full{grid-column:span 2}
.item-card-amt{display:flex;justify-content:space-between;align-items:center;
  margin-top:12px;padding-top:10px;border-top:1px solid #eee}
.item-card-amt-label{font-size:12px;color:var(--muted)}
.item-card-amt-value{font-weight:700;font-size:15px;color:var(--primary)}

/* ════════════════════════════════════
   모바일 반응형
════════════════════════════════════ */
@media(max-width:640px){
  /* 앱바 */
  .appbar-top{padding:0 10px;height:46px}
  #appbar .logo{font-size:13px}
  .ab-btn{padding:5px 8px;font-size:11px}
  .ab-logout{padding:5px 8px;font-size:13px}
  #autosave-badge{display:none}

  /* 패널 */
  #panel-quote{padding:12px}

  /* 모든 input/select 16px (iOS 줌 방지) - print-area 제외 */
  body:not(#print-area) input, body:not(#print-area) select, body:not(#print-area) textarea{font-size:16px!important}

  /* 섹션 카드 */
  .section-card .card-head{font-size:13px;padding:10px 12px}
  .section-card .card-body{padding:10px 12px}
  #panel-quote{padding:10px}

  /* q-grid: 모바일에서도 2열 유지 (문서번호만 전폭) */
  .q-grid{grid-template-columns:1fr 1fr;gap:10px}

  /* 품목: 테이블 숨기고 카드로 */
  #item-table-wrap > table{display:none}
  #item-card-list{display:flex!important;flex-direction:column;gap:10px;padding:12px}

  /* 검색바 */
  .item-search-bar{padding:10px 12px;gap:8px}
  .db-popup{width:calc(100vw - 30px);min-width:0;left:0}

  /* 옵션 */
  .options-row{gap:14px}
  .opt-group label{font-size:14px}

  /* 합계 */
  .total-section{padding:12px 14px}
  .tgrid{gap:5px 20px}
  .tgrid .gv{font-size:17px}

  /* 특기사항 */
  .remarks-grid{grid-template-columns:1fr!important}
  .delivery-row{flex-wrap:nowrap}
  .delivery-row input[type=number]{font-size:16px!important}

  /* 미리보기 버튼 */
  #preview-actions button{font-size:13px!important;padding:13px 8px!important}

  /* 문서함 */
  #panel-docs{padding:12px}
  .doc-card{flex-direction:column;align-items:flex-start;gap:8px}
  .doc-card .doc-actions{width:100%;justify-content:flex-end}

  /* 거래처 */
  #panel-customers{padding:12px}
  .customer-list{grid-template-columns:1fr}

  /* 모달 */
  .modal-box{min-width:0;width:calc(100vw - 20px);padding:16px}

  /* 버튼 */
  .btn-sm{padding:10px 14px;font-size:13px}
}

const manifest = {

};

const manifestUrl = URL.createObjectURL(manifestBlob);
document.getElementById('manifest-link').href = manifestUrl;

// Service Worker 등록
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE = 'hwacheon-quote-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html'])));
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).then(() => {
    console.log('SW 등록 완료');
  }).catch(e => console.log('SW 등록 실패', e));
}

<body>

<!-- 로그인 화면 -->
<div id="login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a3a5c;position:fixed;top:0;left:0;width:100%;z-index:999;opacity:0;pointer-events:none;transition:opacity 0.1s">
  <div style="background:#fff;border-radius:12px;padding:40px;width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.3);text-align:center">
    <div style="font-size:22px;font-weight:700;color:#1a3a5c;margin-bottom:4px">화천이티씨</div>
    <div style="font-size:13px;color:#888;margin-bottom:28px">견적서 시스템</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <input id="login-email" type="email" placeholder="이메일" style="border:1px solid #ddd;border-radius:6px;padding:10px 14px;font-size:14px;outline:none;font-family:var(--font)">
      <input id="login-pw" type="password" placeholder="비밀번호" style="border:1px solid #ddd;border-radius:6px;padding:10px 14px;font-size:14px;outline:none;font-family:var(--font)" onkeydown="if(event.key==='Enter')doLogin()">
      <div id="login-err" style="color:#c0392b;font-size:12px;display:none"></div>
      <button onclick="doLogin()" style="background:#1a3a5c;color:#fff;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font)">로그인</button>
    </div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="main-app" style="display:none">
<div id="appbar">
  <div class="appbar-top">
    <div class="logo">화천<span>ETC</span> 견적서</div>
    <div class="appbar-right">
      <span id="autosave-badge">● 저장됨</span>
      <button class="ab-btn ab-save" onclick="saveDoc()">💾 저장</button>
      <button class="ab-btn" onclick="newDoc()">＋ 새 문서</button>
      <button class="ab-btn ab-logout" onclick="doLogout()" title="로그아웃">⏻</button>
      <button id="install-btn" onclick="installApp()" class="ab-btn ab-install" style="display:none">📲</button>
    </div>
  </div>
  <div class="tabs">
    <button class="active" onclick="showTab('quote',this)">견적서 작성</button>
    <button onclick="showTab('preview',this)">미리보기/인쇄</button>
    <button onclick="showTab('docs',this)">문서함</button>
    <button onclick="showTab('customers',this)">거래처 관리</button>
  </div>
</div>

<!-- 견적서 작성 -->
<div id="panel-quote" class="tab-panel active">
  <div class="section-card">
    <div class="card-head">📋 견적서 정보</div>
    <div class="card-body">
      <div class="fg">
        <label>문서 번호</label>
        <input id="q-no" type="text" readonly style="background:#f5f3ee">
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>견적 일자</label>
          <input id="q-date" type="date">
        </div>
        <div class="fg">
          <label>유효기간</label>
          <input id="q-valid" type="text" value="30일">
        </div>
      </div>
      <div class="fg">
        <label>담당자</label>
        <div style="display:flex;gap:6px">
          <select id="q-manager-sel" onchange="onManagerChange(this.value)" class="fi">
            <option value="문형록">문형록 대표</option>
            <option value="문상록 과장">문상록 과장</option>
            <option value="직접입력">직접입력</option>
          </select>
          <input id="q-manager-custom" type="text" placeholder="담당자명" class="fi" style="display:none;flex:1" oninput="sched()">
        </div>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="card-head" style="display:flex;justify-content:space-between;align-items:center">
      <span>🏢 수신처 (거래처)</span>
      <div style="display:flex;gap:6px">
        <button class="btn-sm btn-primary" onclick="openLoadCust()">📂 불러오기</button>
        <button class="btn-sm" onclick="openSaveCust()">💾 저장</button>
      </div>
    </div>
    <div class="card-body">
      <div class="fg">
        <label>거래처명</label>
        <input id="c-company" type="text" placeholder="거래처명" oninput="sched()">
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>담당자</label>
          <input id="c-person" type="text" placeholder="홍길동 귀중" oninput="sched()">
        </div>
        <div class="fg">
          <label>연락처</label>
          <input id="c-tel" type="text" placeholder="010-0000-0000" oninput="fmtTel(this);sched()" maxlength="13" inputmode="tel">
        </div>
      </div>
      <div class="fg">
        <label>이메일</label>
        <div style="display:flex;gap:6px;align-items:center;width:100%">
          <input id="c-email-id" type="text" placeholder="아이디" inputmode="email" class="fi" style="flex:2;min-width:0">
          <span style="color:#888;flex-shrink:0;font-size:14px">@</span>
          <select id="c-email-domain" onchange="toggleEmailDirect(this.value)" class="fi" style="flex:3;min-width:0">
            <option value="naver.com">naver.com</option>
            <option value="gmail.com">gmail.com</option>
            <option value="daum.net">daum.net</option>
            <option value="direct">직접입력</option>
          </select>
        </div>
        <input id="c-email-domain-custom" type="text" placeholder="도메인 직접입력" inputmode="email" class="fi"
          style="display:none;margin-top:6px;width:100%">
      </div>
      <input id="c-addr" type="text" style="display:none">
    </div>
  </div>

  <div class="section-card">
    <div class="card-head">📦 품목 내역</div>
    <div class="item-search-bar">
      <div style="position:relative;flex:1;min-width:0">
        <input id="item-search" type="text" placeholder="🔍 품목 검색 (화천, 커버, 선반…)"
          oninput="filterDB()" onfocus="showDBPopup()" onblur="setTimeout(hideDBPopup,200)"
          style="width:100%">
        <div id="db-popup" class="db-popup" style="display:none"></div>
      </div>
      <button class="btn-sm btn-primary" onclick="addEmptyRow()" style="flex-shrink:0;white-space:nowrap">＋ 추가</button>
    </div>
    <div id="item-table-wrap">
      <table class="item-table">
        <thead>
          <tr>
            <th class="col-no">No</th>
            <th class="col-name">품 목 명</th>
            <th class="col-spec">규격/모델</th>
            <th class="col-unit">단위</th>
            <th class="col-qty">수량</th>
            <th class="col-up">단가</th>
            <th class="col-amt">공급가액</th>
            <th class="col-note">비고</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="item-tbody"></tbody>
      </table>
      <div id="item-card-list"></div>
    </div>
    <div style="padding:10px 14px;border-top:1px solid var(--border);background:#fafaf8">
      <div class="options-row">
        <div class="opt-group">
          <input type="checkbox" id="opt-vat" onchange="calcTotals()" checked>
          <label for="opt-vat">부가세 (10%)</label>
        </div>
        <div class="opt-group">
          <input type="checkbox" id="opt-disc" onchange="toggleDisc()">
          <label for="opt-disc">추가 할인</label>
          <input type="number" id="disc-val" style="display:none" min="0" max="100" oninput="calcTotals()">
          <select id="disc-type" style="display:none" onchange="calcTotals()">
            <option value="pct">%</option>
            <option value="amt">원</option>
          </select>
        </div>
        <div class="opt-group">
          <input type="checkbox" id="opt-trunc" onchange="calcTotals()">
          <label for="opt-trunc">원 단위 절사</label>
        </div>
      </div>
    </div>
    <div class="total-section">
      <div class="tgrid">
        <div class="tl">공급가액 합계</div><div class="tv" id="t-supply">0 원</div>
        <div class="tl">추가 할인</div><div class="tv" id="t-disc" style="color:var(--danger)">-</div>
        <div class="tl">부가세 (10%)</div><div class="tv" id="t-vat">0 원</div>
        <div class="gl">최종 합계금액</div><div class="gv" id="t-total">0 원</div>
      </div>
    </div>
  </div>

  <!-- 특기사항 구조화 -->
  <div class="section-card">
    <div class="card-head">📝 특기사항</div>
    <div class="card-body">
      <div class="remarks-grid">
        <div class="form-group">
          <label>① 납 기</label>
          <div class="delivery-row">
            <span>발주 후</span>
            <input id="r-delivery-days" type="number" min="1" max="999" placeholder="0" style="width:60px" oninput="sched()">
            <span>일 이내</span>
            <input id="r-delivery-extra" type="text" placeholder="(추가 조건 입력)" style="flex:1;border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-family:var(--font);font-size:12px" oninput="sched()">
          </div>
        </div>
        <div class="form-group">
          <label>② 결재 조건</label>
          <input id="r-payment" type="text" placeholder="예: 세금계산서 발행 후 30일 이내" oninput="sched()">
        </div>
        <div class="form-group">
          <label>③ 견적 유효기간</label>
          <input id="r-valid-period" type="text" placeholder="예: 견적일로부터 30일" value="견적일로부터 30일" oninput="sched()">
        </div>
        <div class="form-group">
          <label>④ 비 고</label>
          <textarea id="r-note" rows="2" placeholder="기타 특이사항, 보증 내용 등 (줄바꿈 가능)" oninput="sched()"></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 미리보기 -->
<div id="panel-preview" class="tab-panel">
  <div id="preview-actions">
    <button onclick="sendEmail()" style="background:#27ae60;color:#fff;border:none;flex:1;padding:14px;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">📧 이메일 발송</button>
    <button onclick="(()=>{
      buildPreview();
      const d=getFormData();
      const company=d.company||'거래처';
      const firstItem=d.items&&d.items.length>0?d.items[0].name:'';
      const pdfName=firstItem?company+'_'+firstItem+'_견적서':company+'_견적서';
      const origTitle=document.title;
      document.title=pdfName;
      setTimeout(()=>{window.print();setTimeout(()=>{document.title=origTitle;},500);},300);
    })()" style="background:var(--primary);color:#fff;border:none;flex:1;padding:14px;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">🖨️ 인쇄 / PDF</button>
  </div>
  <div id="preview-wrap">
    <div id="print-area"></div>
  </div>
</div>

<!-- 문서함 -->
<div id="panel-docs" class="tab-panel">
  <div class="docs-toolbar">
    <input type="text" id="doc-search" placeholder="🔍 문서 검색" oninput="renderDocs()">
    <button class="btn-sm" onclick="renderDocs()">새로고침</button>
  </div>
  <div class="doc-list" id="doc-list"></div>
</div>

<!-- 거래처 관리 -->
<div id="panel-customers" class="tab-panel">
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="btn-sm btn-primary" onclick="openSaveCust()">＋ 거래처 추가</button>
  </div>
  <div class="customer-list" id="customer-list"></div>
</div>

<!-- 거래처 저장 모달 -->
<div class="modal-overlay" id="modal-save-cust">
  <div class="modal-box">
    <h3>거래처 저장</h3>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="form-group"><label>거래처명 *</label><input id="mc-co" type="text"></div>
      <div class="form-group"><label>담당자</label><input id="mc-person" type="text"></div>
      <div class="form-group"><label>연락처</label><input id="mc-tel" type="text" placeholder="010-0000-0000" oninput="fmtTel(this)" maxlength="13"></div>
      <div class="form-group"><label>이메일</label><input id="mc-email" type="text" placeholder="email@example.com"></div>
      <div class="form-group" style="display:none"><label>주소</label><input id="mc-addr" type="text"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-sm" onclick="closeModal('modal-save-cust')">취소</button>
      <button class="btn-sm btn-primary" onclick="saveCust()">저장</button>
    </div>
  </div>
</div>

<!-- 거래처 불러오기 모달 -->
<div class="modal-overlay" id="modal-load-cust">
  <div class="modal-box">
    <h3>거래처 불러오기</h3>
    <input type="text" id="cust-q" placeholder="검색" style="width:100%;border:1px solid var(--border);border-radius:4px;padding:6px 10px;margin-bottom:10px;font-family:var(--font)" oninput="renderCustSearch()">
    <div id="cust-list" style="max-height:260px;overflow-y:auto"></div>
    <div class="modal-footer"><button class="btn-sm" onclick="closeModal('modal-load-cust')">닫기</button></div>
  </div>
</div>

window.onload=()=>{
  const _draft = localStorage.getItem('htc_draft');
  if(_draft){
    // 임시저장 있음 - genDocNo/renderItems는 loadDraft/newDoc에서 처리
    calcTotals();
  } else {
    document.getElementById('q-date').value=new Date().toISOString().slice(0,10);
    genDocNo();
    renderItems();
    calcTotals();
  }
  setInterval(autoSave,30000);
  window._domReady = true;
  if(window._firebaseUser) window._checkDraft();
};

function genDocNo(){
  const d=new Date();
  const no=`HTC-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${100+Math.floor(Math.random()*900)}`;
  document.getElementById('q-no').value=no;
  docId=docId||no;
}

function showTab(name,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('#appbar .tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='preview'){buildPreview();setTimeout(scalePreview,100);}
  if(name==='docs'){loadFirestoreDocs().then(renderDocs);}
  if(name==='customers'){loadFirestoreCusts().then(renderCustomers);}
}

function scalePreview(){
  const wrap=document.getElementById('preview-wrap');
  const area=document.getElementById('print-area');
  if(!wrap||!area)return;
  const wrapW=wrap.clientWidth-40;
  const areaW=794; // A4 고정 너비
  area.style.width=areaW+'px';
  const scale=wrapW/areaW;
  if(scale<1){
    area.style.transform='scale('+scale+')';
    area.style.transformOrigin='top center';
    area.style.marginBottom=((area.offsetHeight*(scale-1)))+'px';
  } else {
    area.style.transform='';
    area.style.transformOrigin='';
    area.style.marginBottom='';
  }
}
window.addEventListener('resize',scalePreview);

function fmtTel(el){
  let v=el.value.replace(/\D/g,'');
  if(v.length<4)el.value=v;
  else if(v.length<8)el.value=v.slice(0,3)+'-'+v.slice(3);
  else if(v.length<=11)el.value=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);
  else el.value=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
}

function toggleEmailDirect(v){
  const dc=document.getElementById('c-email-domain-custom');
  dc.style.display=v==='direct'?'':'none';
  if(v!=='direct')dc.value='';
}
function getEmail(){
  const id=document.getElementById('c-email-id').value.trim();
  if(!id)return'';
  const domSel=document.getElementById('c-email-domain').value;
  const dom=domSel==='direct'?document.getElementById('c-email-domain-custom').value.trim():domSel;
  return dom?id+'@'+dom:id;
}
function setEmail(email){
  if(!email){document.getElementById('c-email-id').value='';return;}
  const parts=email.split('@');
  document.getElementById('c-email-id').value=parts[0]||'';
  if(parts[1]){
    const known=['naver.com','gmail.com','daum.net'];
    const sel=document.getElementById('c-email-domain');
    if(known.includes(parts[1])){
      sel.value=parts[1];
      document.getElementById('c-email-domain-custom').style.display='none';
    }else{
      sel.value='direct';
      document.getElementById('c-email-domain-custom').style.display='';
      document.getElementById('c-email-domain-custom').value=parts[1];
    }
  }
}

function updCardLive(i,f,v){
  items[i][f]=v;
  // 공급가액 즉시 갱신
  if(f==='qty'||f==='price'){
    const el=document.getElementById('card-amt-'+i);
    if(el) el.textContent=comma(items[i].qty*items[i].price)+' 원';
  }
  // 헤더 타이틀 즉시 갱신
  if(f==='name'){
    const card=document.querySelector(`.item-card[data-idx="${i}"] .item-card-title`);
    if(card) card.textContent=v||'품목명을 입력하세요';
  }
  calcTotals();
}

function upd(i,f,v){
  items[i][f]=v;
  const row=document.getElementById('item-tbody').rows[i];

function calcTotals(){
  let supply=items.reduce((s,it)=>s+it.qty*it.price,0);
  let discAmt=0;
  if(document.getElementById('opt-disc').checked){
    const dv=parseFloat(document.getElementById('disc-val').value)||0;
    discAmt=document.getElementById('disc-type').value==='pct'?supply*dv/100:dv;
  }
  const after=supply-discAmt;
  const vat=document.getElementById('opt-vat').checked?Math.round(after*.1):0;
  let total=after+vat;
  if(document.getElementById('opt-trunc').checked)total=Math.floor(total/10)*10;
  document.getElementById('t-supply').textContent=comma(supply)+' 원';
  document.getElementById('t-disc').textContent=document.getElementById('opt-disc').checked?'-'+comma(Math.round(discAmt))+' 원':'-';
  document.getElementById('t-vat').textContent=document.getElementById('opt-vat').checked?comma(vat)+' 원':'미적용';
  document.getElementById('t-total').textContent=comma(total)+' 원';
}
function toggleDisc(){
  const on=document.getElementById('opt-disc').checked;
  document.getElementById('disc-val').style.display=on?'':'none';
  document.getElementById('disc-type').style.display=on?'':'none';
  calcTotals();
}

function stampToSquare(src, size){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=size; c.height=size;
      const ctx=c.getContext('2d');
      // 비율 유지하며 중앙 배치
      const scale=Math.min(size/img.width, size/img.height);
      const w=img.width*scale, h=img.height*scale;
      const x=(size-w)/2, y=(size-h)/2;
      ctx.drawImage(img,x,y,w,h);
      resolve(c.toDataURL('image/png'));
    };
    img.src=src;
  });
}

function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const err=document.getElementById('login-err');
  err.style.display='none';
  if(!email||!pw){err.textContent='이메일과 비밀번호를 입력하세요.';err.style.display='block';return;}
  window._fbFns.signInWithEmailAndPassword(window._auth,email,pw)
    .then(uc=>{
      document.getElementById('login-screen').style.opacity='0';document.getElementById('login-screen').style.pointerEvents='none';
      document.getElementById('main-app').style.display='block';
      document.getElementById('user-info').textContent=uc.user.email;
      // 실시간 리스너는 onAuthStateChanged에서 이미 시작됨
      // 명시적으로 1회 로드도 실행
      loadFirestoreDocs();
      loadFirestoreCusts();
      // 임시저장 있으면 팝업
      const draft=localStorage.getItem('htc_draft');
      if(draft){
        if(confirm('이전에 작업하던 견적서가 있습니다.\n이어서 작업하시겠습니까?\n\n(취소 시 새 문서로 시작합니다)')){
          loadDraft();
        }else{
          localStorage.removeItem('htc_draft');
          newDoc();
        }
      }
    })
    .catch(e=>{
      err.textContent='이메일 또는 비밀번호가 올바르지 않습니다.';
      err.style.display='block';
    });
}

function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?'))return;
  window._authHandled = false;
  window._fbFns.signOut(window._auth).then(()=>{
    document.getElementById('login-screen').style.opacity='1';document.getElementById('login-screen').style.pointerEvents='auto';
    document.getElementById('main-app').style.display='none';
  });
}

// Firebase Firestore 동기화
// ════════════════════════════════════
async function saveDoc(){
  const d=getFormData();
  const company=d.company||'거래처';
  const firstItem=d.items&&d.items.length>0?d.items[0].name:'';
  const fileName=firstItem?`${company}_${firstItem}_견적서`:`${company}_견적서`;
  const data={...d,savedAt:new Date().toISOString(),fileName};
  // 로컬 저장 먼저 (즉시 문서함에 반영)
  localStorage.removeItem('htc_draft');
  setBadge('저장 중...');
  // Firestore 저장
  try{
    const {doc,setDoc,collection}=window._fbFns;
    const db=window._db;
    await setDoc(doc(collection(db,'quotes'),d.docNo),data);
    setBadge('저장됨 ✓');
  }catch(e){
    setBadge('⚠️ 오프라인 저장');
    console.log('Firestore 저장 실패',e);
  }
  // 거래처 자동 등록
  if(d.company){
    const custs=getCusts();
    const exists=custs.find(c=>c.company===d.company);
    if(!exists){
      const newC={id:Date.now(),company:d.company,person:d.person||'',tel:d.tel||'',email:getEmail(),addr:''};
      saveCustToFirestore(newC);
    }
  }
  alert('저장되었습니다:\n'+fileName);
}

async function loadFirestoreDocs(){
  try{
    const {collection,getDocs,query,orderBy}=window._fbFns;
    const db=window._db;
    if(!db) return;
    const q=query(collection(db,'quotes'),orderBy('savedAt','desc'));
    const snap=await getDocs(q);
    _docsCache={};
    snap.forEach(d=>{_docsCache['htc_doc_'+d.id]=d.data();});
  }catch(e){console.log('Firestore 로드 실패',e);}
}

async function loadFirestoreCusts(){
  try{
    const {collection,getDocs}=window._fbFns;
    const db=window._db;
    if(!db) return;
    const snap=await getDocs(collection(db,'customers'));
    _custsCache=[];
    snap.forEach(d=>{_custsCache.push(d.data());});
  }catch(e){console.log('거래처 로드 실패',e);}
}

async function saveCustToFirestore(cust){
  try{
    const {doc,setDoc,collection}=window._fbFns;
    await setDoc(doc(collection(window._db,'customers'),String(cust.id)),cust);
  }catch(e){console.log('거래처 저장 실패',e);}
}

            const keyData=await crypto.subtle.importKey('raw',enc.encode(API_SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);
            const sig=await crypto.subtle.sign('HMAC',keyData,enc.encode(date+salt));
            const signature=Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
            try{
              const res=await fetch('https://api.coolsms.co.kr/messages/v4/send',{
                method:'POST',
                headers:{'Content-Type':'application/json','Authorization':`HMAC-SHA256 apiKey=${API_KEY}, date=${date}, salt=${salt}, signature=${signature}`},
                body:JSON.stringify({message:{to:d.tel.replace(/-/g,''),from,text:msg}}),
              });
              const json=await res.json();
              if(res.ok) alert('✅ 문자 발송 완료!\n'+d.tel);
              else alert('❌ 문자 발송 실패: '+(json.errorMessage||JSON.stringify(json)));
            }catch(e){ alert('❌ 문자 오류: '+e.message); }
          })();
        }
      }
    })
    .catch(e=>{
      alert('❌ 발송 실패: '+(e.text||e.message||e));
    });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('install-btn');
  if(btn) btn.style.display = '';
});
function installApp(){
  if(!deferredPrompt){ alert('이미 설치되어 있거나 이 브라우저에서는 지원하지 않습니다.'); return; }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(r => {
    if(r.outcome === 'accepted') document.getElementById('install-btn').style.display='none';
    deferredPrompt = null;
  });
}
window.addEventListener('appinstalled', () => {
  document.getElementById('install-btn').style.display='none';
  deferredPrompt = null;
});

function comma(n){if(isNaN(n)||n==='')return'0';return Math.round(n).toLocaleString('ko-KR');}
function parseN(v){return parseFloat(String(v).replace(/,/g,''))||0;}
function fmtI(el){const v=parseN(el.value);el.value=v?comma(v):'';}
function esc(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function fmtDt(s){if(!s)return'';const d=new Date(s);return`${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;}
function p2(n){return String(n).padStart(2,'0');}
